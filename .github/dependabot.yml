version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # PyTorch CUDA builds are pinned to cu128 official wheels from download.pytorch.org
      # Updating to PyPI builds replaces them with CPU-only wheels, breaking GPU inference and LoRA.
      - dependency-name: "torch"
      - dependency-name: "torchaudio"
