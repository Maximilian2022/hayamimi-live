services:
  hayamimi-cloud:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    container_name: hayamimi_cloud
    restart: unless-stopped
    ports:
      - "127.0.0.1:8833:8833"
    env_file:
      - .env
    volumes:
      - hayamimi_data:/app/data
      - hayamimi_models:/app/models
    mem_limit: 750m
    mem_reservation: 400m

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: hayamimi_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - hayamimi-cloud

volumes:
  hayamimi_data:
    name: hayamimi_cloud_data
  hayamimi_models:
    name: hayamimi_cloud_models
