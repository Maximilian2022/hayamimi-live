services:
  hayamimi-cloud:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    container_name: hayamimi_cloud
    restart: unless-stopped
    ports:
      - "127.0.0.1:8833:8833"
    env_file:
      - .env
    volumes:
      - hayamimi_data:/app/data
      - hayamimi_models:/app/models
    mem_limit: 750m
    mem_reservation: 400m
    networks:
      - default
      - tunnel_net

volumes:
  hayamimi_data:
    name: hayamimi_cloud_data
  hayamimi_models:
    name: hayamimi_cloud_models

networks:
  default:
  tunnel_net:
    name: event-tts-bot_bot_network
    external: true
