<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>早耳 クラウドマイク入力</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@500;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0d13;
      color: #e2e8f0;
      font-family: 'Inter', 'M PLUS Rounded 1c', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #151822;
      border-bottom: 1px solid #232736;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-back {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .btn-back:hover {
      color: #f1f5f9;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #1e293b;
      color: #94a3b8;
    }

    .status-badge.connected {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    .status-badge.recording {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    main {
      flex: 1;
      max-width: 860px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card {
      background: #151822;
      border: 1px solid #232736;
      border-radius: 12px;
      padding: 1.25rem;
    }

    /* Controls */
    .controls-row {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .btn-record {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 1.75rem;
      background: #3b82f6;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      transition: all 0.2s ease;
    }

    .btn-record:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    .btn-record.active {
      background: #ef4444;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
      }

      70% {
        box-shadow: 0 0 0 12px rgba(239, 68, 68, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }

    .device-select-wrap {
      flex: 1;
      min-width: 200px;
    }

    .select-label {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 0.25rem;
      display: block;
    }

    .device-select {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3449;
      color: #f1f5f9;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    /* VU Meter */
    .vu-meter-container {
      width: 100%;
      margin-top: 1rem;
      background: #0f1117;
      border: 1px solid #232736;
      padding: 0.75rem 1rem;
      border-radius: 8px;
    }

    .vu-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 0.4rem;
    }

    .vu-bar-bg {
      height: 8px;
      background: #1e293b;
      border-radius: 9999px;
      overflow: hidden;
    }

    .vu-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981 0%, #f59e0b 70%, #ef4444 100%);
      border-radius: 9999px;
      transition: width 0.08s ease-out;
    }

    /* Feed Container */
    .feed-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 420px;
    }

    .feed-header {
      font-size: 0.95rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
    }

    .feed-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse;
      gap: 0.6rem;
      background: #0f1117;
      border: 1px solid #232736;
      border-radius: 8px;
      padding: 1rem;
    }

    .feed-item {
      padding: 0.6rem 0.85rem;
      background: #181c28;
      border-left: 3px solid #3b82f6;
      border-radius: 0 6px 6px 0;
      font-size: 1rem;
      line-height: 1.5;
      animation: fadeIn 0.2s ease;
    }

    .feed-item.partial {
      background: rgba(59, 130, 246, 0.12);
      border-left: 3px solid #60a5fa;
      color: #93c5fd;
      font-style: italic;
    }

    .feed-item-trans {
      font-size: 0.9rem;
      color: #ffd166;
      margin-top: 0.25rem;
      display: flex;
      gap: 0.4rem;
      align-items: baseline;
    }

    .lang-tag {
      background: rgba(255, 209, 102, 0.2);
      color: #ffd166;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .feed-empty {
      color: #64748b;
      font-size: 0.9rem;
      text-align: center;
      margin: auto;
    }

    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      margin-top: 0.75rem;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-left">
      <a href="/" class="btn-back">◀ ダッシュボード</a>
      <span class="header-title">Webマイク入力</span>
    </div>
    <div id="status-badge" class="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">未接続</span>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="controls-row">
        <button id="btn-toggle" class="btn-record" onclick="toggleRecording()">
          <span id="btn-icon">🎙️</span>
          <span id="btn-text">マイク開始</span>
        </button>

        <div class="device-select-wrap">
          <label class="select-label">マイク入力デバイス</label>
          <select id="audio-device-select" class="device-select" onchange="switchDevice()">
            <option value="">デフォルトマイク</option>
          </select>
        </div>
      </div>

      <div class="vu-meter-container">
        <div class="vu-label">
          <span>マイク入力レベル</span>
          <span id="vu-val">0%</span>
        </div>
        <div class="vu-bar-bg">
          <div id="vu-fill" class="vu-bar-fill"></div>
        </div>
      </div>

      <div id="error-banner" class="error-banner"></div>
    </div>

    <div class="card feed-container">
      <div class="feed-header">
        <span>リアルタイム認識フィード（最新が上）</span>
        <span style="font-size: 0.8rem; color: #64748b;">※ OBS 側にもリアルタイムに配信されています</span>
      </div>
      <div id="feed-list" class="feed-list">
        <div id="feed-empty" class="feed-empty">マイクを開始して話すと、ここにリアルタイム字幕が表示されます</div>
      </div>
    </div>
  </main>

  <script>
    let ws = null;
    let audioCtx = null;
    let micStream = null;
    let scriptNode = null;
    let isRecording = false;

    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const btnToggle = document.getElementById('btn-toggle');
    const btnIcon = document.getElementById('btn-icon');
    const btnText = document.getElementById('btn-text');
    const vuFill = document.getElementById('vu-fill');
    const vuVal = document.getElementById('vu-val');
    const feedList = document.getElementById('feed-list');
    const feedEmpty = document.getElementById('feed-empty');
    const errorBanner = document.getElementById('error-banner');
    const deviceSelect = document.getElementById('audio-device-select');

    function showError(msg) {
      if (msg) {
        errorBanner.textContent = msg;
        errorBanner.style.display = 'block';
      } else {
        errorBanner.style.display = 'none';
      }
    }

    async function loadAudioDevices() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputs = devices.filter(d => d.kind === 'audioinput');
        if (audioInputs.length === 0) return;

        const curVal = deviceSelect.value;
        deviceSelect.innerHTML = '<option value="">デフォルトマイク</option>';
        audioInputs.forEach((d, idx) => {
          const opt = document.createElement('option');
          opt.value = d.deviceId;
          opt.textContent = d.label || `マイク ${idx + 1}`;
          if (d.deviceId === curVal) opt.selected = true;
          deviceSelect.appendChild(opt);
        });
      } catch (e) {
        console.warn('マイクデバイス列挙失敗:', e);
      }
    }

    function connectWs() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws/mic`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusBadge.className = 'status-badge connected';
        statusText.textContent = isRecording ? '● 認識中' : '接続完了 (待機中)';
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'transcript') {
            handleTranscript(data.text, data.is_final);
          } else if (data.type === 'translation') {
            handleTranslation(data.lang, data.text);
          } else if (data.type === 'error') {
            showError('サーバーエラー: ' + data.message);
          }
        } catch (e) { }
      };

      ws.onclose = () => {
        statusBadge.className = 'status-badge';
        statusText.textContent = '切断 (再接続中...)';
        if (isRecording) {
          stopRecording();
        }
        setTimeout(connectWs, 2000);
      };
    }

    let curPartialEl = null;
    let lastFinalEl = null;

    function handleTranscript(text, isFinal) {
      if (!text || !text.trim()) return;
      if (feedEmpty) feedEmpty.style.display = 'none';

      if (!isFinal) {
        // 発話中の追随字幕
        if (!curPartialEl) {
          curPartialEl = document.createElement('div');
          curPartialEl.className = 'feed-item partial';
          feedList.insertBefore(curPartialEl, feedList.firstChild);
        }
        curPartialEl.textContent = '… ' + text;
      } else {
        // 確定字幕
        let targetEl = curPartialEl;
        if (targetEl) {
          targetEl.className = 'feed-item';
          targetEl.textContent = text;
          curPartialEl = null;
        } else {
          targetEl = document.createElement('div');
          targetEl.className = 'feed-item';
          targetEl.textContent = text;
          feedList.insertBefore(targetEl, feedList.firstChild);
        }
        lastFinalEl = targetEl;

        while (feedList.children.length > 60) {
          feedList.removeChild(feedList.lastChild);
        }
      }
    }

    function handleTranslation(lang, text) {
      if (!text || !text.trim()) return;
      const target = lastFinalEl || feedList.firstElementChild;
      if (!target || target === feedEmpty) return;

      const transEl = document.createElement('div');
      transEl.className = 'feed-item-trans';
      transEl.innerHTML = `<span class="lang-tag">${lang}</span> <span>${text}</span>`;
      target.appendChild(transEl);
    }

    async function toggleRecording() {
      showError(null);
      if (isRecording) {
        stopRecording();
      } else {
        await startRecording();
      }
    }

    async function switchDevice() {
      if (isRecording) {
        stopRecording();
        await startRecording();
      }
    }

    // ネイティブレートから 16000Hz への正確な線形補間リサンプラー
    function resampleTo16k(inputData, inSampleRate) {
      if (inSampleRate === 16000) {
        return inputData;
      }
      const ratio = inSampleRate / 16000;
      const outLength = Math.floor(inputData.length / ratio);
      const output = new Float32Array(outLength);

      for (let i = 0; i < outLength; i++) {
        const srcPos = i * ratio;
        const srcIdx = Math.floor(srcPos);
        const frac = srcPos - srcIdx;
        const s0 = inputData[srcIdx] || 0;
        const s1 = inputData[srcIdx + 1] || s0;
        output[i] = s0 + (s1 - s0) * frac;
      }
      return output;
    }

    async function startRecording() {
      try {
        const selectedDev = deviceSelect.value;
        const constraints = {
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          }
        };
        if (selectedDev) {
          constraints.audio.deviceId = { ideal: selectedDev };
        }

        try {
          micStream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch (e1) {
          console.warn('詳細制約でのマイク取得失敗、基本設定で再試行:', e1);
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        const source = audioCtx.createMediaStreamSource(micStream);
        const inSampleRate = audioCtx.sampleRate;

        // 4096 サンプルごとに処理
        scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);
        scriptNode.onaudioprocess = (e) => {
          if (!isRecording || !ws || ws.readyState !== WebSocket.OPEN) return;
          const inputData = e.inputBuffer.getChannelData(0);

          // VU メーター計算 (RMS)
          let sum = 0;
          for (let i = 0; i < inputData.length; i++) {
            sum += inputData[i] * inputData[i];
          }
          const rms = Math.sqrt(sum / inputData.length);
          const level = Math.min(100, Math.round(rms * 450));
          vuFill.style.width = level + '%';
          vuVal.textContent = level + '%';

          // 16kHz にリサンプルして Float32Array バイナリを送信
          const resampled16k = resampleTo16k(inputData, inSampleRate);
          ws.send(resampled16k.buffer);
        };

        source.connect(scriptNode);
        scriptNode.connect(audioCtx.destination);

        isRecording = true;
        btnToggle.className = 'btn-record active';
        btnIcon.textContent = '⏹️';
        btnText.textContent = 'マイク停止';
        statusBadge.className = 'status-badge recording';
        statusText.textContent = '● 認識中';

        loadAudioDevices();
      } catch (err) {
        console.error('マイクアクセス例外:', err);
        let msg = 'マイクへのアクセスに失敗しました: ' + err.message;
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          msg = '🚫 マイクの使用がブラウザまたはOSでブロックされています。アドレスバーの鍵アイコン等からマイクアクセスを許可してください。';
        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
          msg = '🎤 マイクが見つかりません。マイクがPCに正しく接続されているか確認してください。';
        } else if (err.name === 'NotReadableError') {
          msg = '⚠️ マイクが別のアプリ（Discord、Zoomなど）で排他使用されている可能性があります。';
        }
        showError(msg);
        stopRecording();
      }
    }

    function stopRecording() {
      isRecording = false;
      if (scriptNode) {
        try { scriptNode.disconnect(); } catch (e) { }
        scriptNode = null;
      }
      if (audioCtx) {
        try { audioCtx.close(); } catch (e) { }
        audioCtx = null;
      }
      if (micStream) {
        try {
          micStream.getTracks().forEach(t => t.stop());
        } catch (e) { }
        micStream = null;
      }
      btnToggle.className = 'btn-record';
      btnIcon.textContent = '🎙️';
      btnText.textContent = 'マイク開始';
      vuFill.style.width = '0%';
      vuVal.textContent = '0%';
      if (ws && ws.readyState === WebSocket.OPEN) {
        statusBadge.className = 'status-badge connected';
        statusText.textContent = '接続完了 (待機中)';
      }
    }

    // 初回接続
    connectWs();
    loadAudioDevices();
  </script>
</body>

</html>
