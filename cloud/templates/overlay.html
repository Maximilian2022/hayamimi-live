<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>早耳 OBS 字幕オーバーレイ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Bungee&family=Dela+Gothic+One&family=Do+Hyeon&family=DotGothic16&family=Fredoka:wght@500;700&family=Hachi+Maru+Pop&family=IBM+Plex+Sans+JP:wght@500;700&family=Jua&family=Kaisei+Decol:wght@700&family=Kiwi+Maru:wght@500&family=Kosugi+Maru&family=M+PLUS+1p:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Montserrat:wght@500;700;800&family=Noto+Sans+JP:wght@500;700;900&family=Oswald:wght@500;700&family=Rampart+One&family=Reggae+One&family=Righteous&family=Shippori+Mincho+B1:wght@600;800&family=Yuji+Boku&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #subtitle-container {
      position: absolute;
      left: 2vw;
      right: 2vw;
      bottom: 4vh;
      display: flex;
      flex-direction: column;
      pointer-events: none;
      transition: all 0.2s ease;
    }
    .subtitle-box {
      display: inline-block;
      max-width: 96%;
      word-break: break-word;
      line-height: 1.35;
      transition: opacity 0.5s ease, transform 0.5s ease;
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .subtitle-box.fade-out {
      opacity: 0 !important;
      transform: translateY(8px);
    }
    #final-line {
      display: block;
    }
    #partial-line {
      display: block;
      opacity: 0.85;
      font-style: normal;
    }
    #trans-line {
      display: block;
      margin-top: 0.28em;
      opacity: 0.95;
    }
    .trans-item {
      display: block;
      line-height: 1.3;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.97) translateY(4px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .error-notice {
      color: #f87171;
      font-size: 20px;
      background: rgba(0, 0, 0, 0.85);
      padding: 10px 20px;
      border-radius: 8px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="subtitle-container">
    {% if error %}
    <div class="error-notice">{{ error }}</div>
    {% else %}
    <div id="sub-box" class="subtitle-box" style="display: none;">
      <div id="final-line"></div>
      <div id="partial-line" style="display: none;"></div>
      <div id="trans-line"></div>
    </div>
    {% endif %}
  </div>

  {% if not error %}
  <script>
    const subContainer = document.getElementById('subtitle-container');
    const subBox = document.getElementById('sub-box');
    const finalLine = document.getElementById('final-line');
    const partialLine = document.getElementById('partial-line');
    const transLine = document.getElementById('trans-line');
    const token = new URLSearchParams(window.location.search).get('token') || '';
    let currentStyle = {{ style | tojson if style else '{}' }};
    let fadeTimer = null;

    function hexToRgba(hex, alphaPercent) {
      hex = (hex || "#000000").replace("#", "");
      if (hex.length === 3) hex = hex.split("").map(c => c+c).join("");
      const r = parseInt(hex.substring(0, 2), 16) || 0;
      const g = parseInt(hex.substring(2, 4), 16) || 0;
      const b = parseInt(hex.substring(4, 6), 16) || 0;
      return `rgba(${r}, ${g}, ${b}, ${(alphaPercent || 0) / 100})`;
    }

    function generateTextShadow(color, width, effect) {
      if (width <= 0) return "none";
      if (effect === "glow") {
        return `0 0 ${width * 2}px ${color}, 0 0 ${width * 4}px ${color}, 0 0 ${width * 7}px ${color}`;
      }
      if (effect === "double") {
        let s = [];
        for (let x = -width; x <= width; x++) {
          for (let y = -width; y <= width; y++) {
            if (x !== 0 || y !== 0) s.push(`${x}px ${y}px 0 #000000`);
          }
        }
        const w2 = width + 2;
        for (let x = -w2; x <= w2; x += 2) {
          for (let y = -w2; y <= w2; y += 2) {
            s.push(`${x}px ${y}px 0 ${color}`);
          }
        }
        s.push(`0 0 ${w2 * 2}px ${color}`);
        return s.join(", ");
      }
      let s = [];
      for (let x = -width; x <= width; x++) {
        for (let y = -width; y <= width; y++) {
          if (x !== 0 || y !== 0) s.push(`${x}px ${y}px 0 ${color}`);
        }
      }
      s.push(`0 0 ${width * 2}px ${color}`);
      return s.join(", ");
    }

    function applyStyle(s) {
      if (!s) return;
      currentStyle = Object.assign({}, currentStyle, s);

      // 配置
      const align = currentStyle.align || 'center';
      if (align === 'left') {
        subContainer.style.alignItems = 'flex-start';
        subBox.style.textAlign = 'left';
      } else if (align === 'right') {
        subContainer.style.alignItems = 'flex-end';
        subBox.style.textAlign = 'right';
      } else {
        subContainer.style.alignItems = 'center';
        subBox.style.textAlign = 'center';
      }

      // 画面下部余白
      subContainer.style.bottom = (currentStyle.bottom != null ? currentStyle.bottom : 4.0) + 'vh';

      // メイン字幕フォント・文字色・サイズ
      const baseFont = currentStyle.font || "'Zen Kaku Gothic New', sans-serif";
      const baseSize = currentStyle.size || 42;
      const baseColor = currentStyle.color || '#ffffff';
      const strokeColor = currentStyle.strokeColor || '#000000';
      const strokeWidth = parseFloat(currentStyle.strokeWidth != null ? currentStyle.strokeWidth : 3.0);
      const effect = currentStyle.effect || 'stroke';
      const mainShadow = generateTextShadow(strokeColor, strokeWidth, effect);

      finalLine.style.fontFamily = baseFont;
      finalLine.style.fontSize = baseSize + 'px';
      finalLine.style.color = baseColor;
      finalLine.style.fontWeight = '800';
      finalLine.style.textShadow = mainShadow;

      // 追随・ドラフト字幕スタイル
      partialLine.style.fontFamily = baseFont;
      partialLine.style.fontSize = Math.round(baseSize * 0.92) + 'px';
      partialLine.style.color = baseColor;
      partialLine.style.fontWeight = '700';
      partialLine.style.textShadow = mainShadow;

      // 翻訳字幕スタイル
      const transSize = currentStyle.transSize || Math.round(baseSize * 0.72);
      const transColor = currentStyle.transColor || '#ffd166';
      const transStrokeColor = currentStyle.transStrokeColor || '#000000';
      const transStrokeWidth = parseFloat(currentStyle.transStrokeWidth != null ? currentStyle.transStrokeWidth : 2.5);
      const transEffect = currentStyle.transEffect || 'stroke';

      transLine.style.fontFamily = baseFont;
      transLine.style.fontSize = transSize + 'px';
      transLine.style.color = transColor;
      transLine.style.fontWeight = '700';
      transLine.style.textShadow = generateTextShadow(transStrokeColor, transStrokeWidth, transEffect);
      transLine.style.display = (currentStyle.showTrans !== false) ? 'block' : 'none';

      // 背景・角丸
      const bgOpacity = parseInt(currentStyle.bgOpacity != null ? currentStyle.bgOpacity : 0);
      if (bgOpacity > 0) {
        subBox.style.backgroundColor = hexToRgba(currentStyle.bgColor || '#000000', bgOpacity);
        subBox.style.padding = '12px 26px';
        subBox.style.backdropFilter = 'blur(6px)';
        subBox.style.border = '1px solid rgba(255, 255, 255, 0.12)';
      } else {
        subBox.style.backgroundColor = 'transparent';
        subBox.style.padding = '0';
        subBox.style.backdropFilter = 'none';
        subBox.style.border = 'none';
      }
      subBox.style.borderRadius = (currentStyle.radius != null ? currentStyle.radius : 8) + 'px';
    }

    // 初期スタイル適用
    applyStyle(currentStyle);

    function resetFadeTimer() {
      if (fadeTimer) {
        clearTimeout(fadeTimer);
      }
      subBox.classList.remove('fade-out');
      // 8 秒後にフェードアウト
      fadeTimer = setTimeout(() => {
        subBox.classList.add('fade-out');
        setTimeout(() => {
          if (subBox.classList.contains('fade-out')) {
            subBox.style.display = 'none';
          }
        }, 500);
      }, 8000);
    }

    function showPartial(text) {
      resetFadeTimer();
      partialLine.textContent = text;
      partialLine.style.display = 'block';
      subBox.style.display = 'inline-block';
    }

    function showFinal(text) {
      resetFadeTimer();
      finalLine.textContent = text;
      partialLine.textContent = '';
      partialLine.style.display = 'none';
      transLine.innerHTML = ''; // 新しい翻訳を待機
      subBox.style.display = 'inline-block';
    }

    function showTranslation(lang, text) {
      if (currentStyle.showTrans === false) return;
      const item = document.createElement('div');
      item.className = 'trans-item';
      item.textContent = `→ [${lang}] ${text}`;
      transLine.appendChild(item);
      resetFadeTimer();
    }

    function connectSSE() {
      const sseUrl = `/events?token=${encodeURIComponent(token)}`;
      const es = new EventSource(sseUrl);

      es.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'style' && data.style) {
            applyStyle(data.style);
          } else if (data.type === 'asr_partial') {
            if (data.text && data.text.trim()) {
              showPartial(data.text);
            }
          } else if (data.type === 'asr_final') {
            if (data.text && data.text.trim()) {
              showFinal(data.text);
            }
          } else if (data.type === 'translation') {
            if (data.text && data.text.trim()) {
              showTranslation(data.lang, data.text);
            }
          } else if (data.text && data.text.trim()) {
            showFinal(data.text);
          }
        } catch (e) {}
      };

      es.onerror = () => {
        es.close();
        setTimeout(connectSSE, 3000);
      };
    }

    connectSSE();
  </script>
  {% endif %}
</body>
</html>
