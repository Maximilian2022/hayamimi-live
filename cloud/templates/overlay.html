<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>早耳 OBS 字幕オーバーレイ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Yuji+Boku&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }
    #subtitle-container {
      position: absolute;
      bottom: 40px;
      left: 40px;
      right: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .subtitle-box {
      background: rgba(15, 17, 23, 0.75);
      backdrop-filter: blur(8px);
      padding: 12px 28px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 38px;
      font-weight: 800;
      line-height: 1.4;
      text-align: center;
      max-width: 90%;
      word-break: break-word;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(59, 130, 246, 0.4);
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .subtitle-box.fade-out {
      opacity: 0;
      transform: translateY(10px);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .error-notice {
      color: #f87171;
      font-size: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 8px 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="subtitle-container">
    {% if error %}
    <div class="error-notice">{{ error }}</div>
    {% else %}
    <div id="sub-box" class="subtitle-box" style="display: none;"></div>
    {% endif %}
  </div>

  {% if not error %}
  <script>
    const subBox = document.getElementById('sub-box');
    const token = new URLSearchParams(window.location.search).get('token') || '';
    let fadeTimer = null;

    function connectSSE() {
      const sseUrl = `/events?token=${encodeURIComponent(token)}`;
      const es = new EventSource(sseUrl);

      es.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.text && data.text.trim()) {
            showSubtitle(data.text);
          }
        } catch (e) {}
      };

      es.onerror = () => {
        es.close();
        setTimeout(connectSSE, 3000);
      };
    }

    function showSubtitle(text) {
      if (fadeTimer) {
        clearTimeout(fadeTimer);
      }
      subBox.textContent = text;
      subBox.style.display = 'block';
      subBox.classList.remove('fade-out');

      // 8 秒後にフェードアウト
      fadeTimer = setTimeout(() => {
        subBox.classList.add('fade-out');
        setTimeout(() => {
          if (subBox.classList.contains('fade-out')) {
            subBox.style.display = 'none';
          }
        }, 800);
      }, 8000);
    }

    connectSSE();
  </script>
  {% endif %}
</body>
</html>
